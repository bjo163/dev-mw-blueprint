[workspace]
resolver = "2"
members = [
  "crates/mizan-model",
  "crates/mizan-contract",
  "crates/mizan-role",
  "crates/mizan-authority",
  "crates/mizan-th",
  "crates/mizan-routing",
  "crates/mizan-evidence",
  "crates/mizan-factors",
  "crates/mizan-engine",
  "crates/mizan-ledger",
  "crates/mizan-cli",
  "crates/mizan-api",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.81"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
