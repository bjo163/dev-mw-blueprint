services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mizan
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mizan"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mizan_pgdata:/var/lib/postgresql/data

  mizan-api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mizan
      MIZAN_BIND: 0.0.0.0:3000
      RUST_LOG: mizan_api=info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  mizan_pgdata:
